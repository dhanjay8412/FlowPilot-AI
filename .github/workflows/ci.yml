name: FlowPilot AI CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        env:
          MONGODB_URI: mongodb://localhost:27017/flowpilot_test
          JWT_SECRET: test-secret-key-min-32-characters-long
          ENABLE_MOCK_AI: 'true'
        run: npm run test

      - name: Build All Workspaces
        run: npm run build
